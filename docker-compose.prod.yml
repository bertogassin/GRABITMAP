services:
  grabit:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      PORT: "3000"
      PUBLIC_BASE_URL: "https://grabitmap.com"
      GRABIT_COOKIE_SECURE: "1"
    volumes:
      - grabit-data:/app/data
      - /var/lib/grabit-monitor:/run/grabit-monitor:ro
    expose:
      - "3000"
    networks:
      - app-net
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      grabit:
        condition: service_healthy
    networks:
      - app-net

volumes:
  grabit-data:
  caddy-data:
  caddy-config:

networks:
  app-net:
    driver: bridge
